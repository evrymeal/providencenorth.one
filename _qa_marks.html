<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>mark comparison</title>
<style>
 body{margin:0;background:#0D0C0A;color:#FBF9F5;font:13px monospace;padding:14px}
 .row{display:flex;gap:28px;align-items:flex-start}
 figure{margin:0;text-align:center}
 figcaption{padding:6px 0;color:#F4D389}
 .box{width:220px;height:220px;border:1px solid #504535;display:flex;align-items:center;justify-content:center;background:#0F0E0C}
 img{width:200px;height:200px;object-fit:contain;image-rendering:auto}
 svg{width:150px;height:150px}
</style></head><body>
<div class="row">
  <figure><div class="box"><img src="/assets/img/providence-north-logo.png" alt="logo master"></div><figcaption>1. providence-north-logo.png (master)</figcaption></figure>
  <figure><div class="box"><img src="/assets/img/brand-mark@2x.png" alt="header mark"></div><figcaption>2. brand-mark@2x.png (header, 40px)</figcaption></figure>
  <figure><div class="box"><img src="/assets/img/brand-mark-64.png" alt="64 mark"></div><figcaption>3. brand-mark-64.png</figcaption></figure>
  <figure><div class="box">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <defs><linearGradient id="sg" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#E5A93C"/><stop offset="1" stop-color="#FFF3D6"/></linearGradient></defs>
      <path d="M12 1 L13.7 10.3 L23 12 L13.7 13.7 L12 23 L10.3 13.7 L1 12 L10.3 10.3 Z" fill="url(#sg)"/>
    </svg></div><figcaption>4. the hero's inline star SVG</figcaption></figure>
</div>
</body></html>
